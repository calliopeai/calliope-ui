name: release

# A `v*` tag publishes the version it names: built and checked once, then the
# same tarball goes to npm (with provenance) and to GitHub Packages. A
# registry whose token is missing is skipped with a warning; the other still
# publishes. Re-running after adding a token publishes only what is missing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: The tag names the package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME does not name package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-storybook

      - name: Pack
        id: pack
        run: |
          npm pack
          npm run pack:check
          echo "tarball=$(ls calliopeai-ui-*.tgz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: calliopeai-ui-*.tgz
          retention-days: 5

  npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm signs the provenance statement with the workflow's OIDC identity.
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - name: Check for the npm token
        id: token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning title=npm skipped::The NPM_TOKEN secret is not set, so @calliopeai/ui@$VERSION was not published to npm. Add the secret and re-run this job."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: package

      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@calliopeai/ui@$VERSION" version > /dev/null 2>&1; then
            echo "::notice title=npm::@calliopeai/ui@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "./$TARBALL" --provenance --access public

  github-packages:
    name: publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning title=GitHub Packages skipped::No GITHUB_TOKEN is available, so @calliopeai/ui@$VERSION was not published to GitHub Packages."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@calliopeai"

      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: package

      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@calliopeai/ui@$VERSION" version --registry https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "::notice title=GitHub Packages::@calliopeai/ui@$VERSION is already on GitHub Packages; nothing to publish."
            exit 0
          fi
          # GitHub Packages takes no provenance statement; the flag beats publishConfig.
          npm publish "./$TARBALL" --registry https://npm.pkg.github.com --provenance=false
