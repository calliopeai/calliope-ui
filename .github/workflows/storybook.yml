name: storybook

# After a merge to main: the always tier once more (it proves the merge, not
# just the branch), then the catalog to GitHub Pages. One job, so setup is
# paid once; documentation-only merges do not rebuild it.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build-storybook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
          retention-days: 3

      - id: deployment
        uses: actions/deploy-pages@v5
